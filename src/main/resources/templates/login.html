<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
        <meta name="description" content="Login Page">
        <title>Login Page</title>
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M"
              crossorigin="anonymous">
        <link href="https://getbootstrap.com/docs/4.0/examples/sign-in/signin.css"
              rel="stylesheet" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <h2 class="form-signin-heading">Need Login</h2>
            <p>(login with OAuth2.0)</p>
            <p>외부 로그인 계정을 선택해 주세요</p>
            <table class="table table-striped" th:each="url : ${urls}">
                <tr>
                    <td><a th:href="${url.value}" th:text="${url.key}">OAuth Provider</a></td>
                </tr>
            </table>
            <div class="card card-container">
                <img id="profile-img" class="profile-img-card" src="//ssl.gstatic.com/accounts/ui/avatar_2x.png" />
                <p id="profile-name" class="profile-name-card"></p>
            </div>
        </div>
    </body>
</html>
